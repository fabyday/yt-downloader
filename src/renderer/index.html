<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://*.googlevideo.com; img-src 'self' data: https:; style-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT Section Downloader</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <div class="input-bar">
          <label class="url-field">
            <span>YouTube URL</span>
            <input
              id="urlInput"
              type="url"
              placeholder="https://www.youtube.com/watch?v=..."
              autocomplete="off"
            />
          </label>
          <button id="loadButton" class="primary-button" type="button">
            불러오기
          </button>
        </div>

        <section id="videoInfo" class="video-info hidden" aria-live="polite">
          <strong id="videoTitle"></strong>
        </section>

        <div id="playerStage" class="player-stage">
          <div class="player-viewport">
            <div id="player" class="player-placeholder">
              <span>URL을 입력하면 미리보기가 여기에 표시됩니다.</span>
            </div>
          </div>
        </div>

        <section class="timeline-panel">
          <div class="timeline-meta">
            <span>재생 위치</span>
            <strong id="durationTime">--:--.---</strong>
          </div>
          <div id="timelineShell" class="timeline-shell">
            <div class="timeline-track" aria-hidden="true">
              <div id="timelineSegments" class="timeline-segments"></div>
              <div id="timelineRange" class="timeline-range hidden"></div>
              <div id="timelineFill" class="timeline-fill"></div>
            </div>
            <button
              id="startMarkerHandle"
              class="timeline-marker timeline-marker-start hidden"
              type="button"
              aria-label="시작 지점 조절"
            ></button>
            <button
              id="endMarkerHandle"
              class="timeline-marker timeline-marker-end hidden"
              type="button"
              aria-label="끝 지점 조절"
            ></button>
            <input
              id="timelineInput"
              class="timeline-input"
              type="range"
              min="0"
              max="0"
              step="0.01"
              value="0"
              aria-label="재생 위치"
              disabled
            />
            <div
              id="currentTimeAnchor"
              class="timeline-current-anchor hidden"
              aria-hidden="true"
            >
              <span class="timeline-current-line"></span>
              <span class="timeline-current-knob"></span>
              <span class="timeline-seeking-label">이동 중</span>
            </div>
          </div>
        </section>

        <section class="transport">
          <div class="time-readout">
            <span class="label">현재</span>
            <strong id="currentTime">00:00.000</strong>
          </div>

          <div class="button-row">
            <button id="backFineButton" class="icon-button" type="button" title="0.1초 뒤로">
              -0.1
            </button>
            <button id="backButton" class="icon-button" type="button" title="1초 뒤로">
              -1
            </button>
            <button id="playPauseButton" class="control-button" type="button">
              재생/정지
            </button>
            <button id="forwardButton" class="icon-button" type="button" title="1초 앞으로">
              +1
            </button>
            <button id="forwardFineButton" class="icon-button" type="button" title="0.1초 앞으로">
              +0.1
            </button>
          </div>

          <label class="loop-toggle">
            <input id="loopToggle" type="checkbox" />
            <span>구간 반복</span>
          </label>
        </section>

        <section class="markers">
          <div class="markers-header">
            <div>
              <span class="label">다운로드 범위</span>
              <strong id="rangeSummary">전체 영상</strong>
            </div>
            <button id="resetSelectionButton" type="button">
              전체 길이로 초기화
            </button>
          </div>

          <div class="marker-row">
            <div>
              <span class="label">시작 지점</span>
              <strong id="startTime">--:--.---</strong>
            </div>
            <button id="setStartButton" type="button">현재 위치로 설정</button>
          </div>

          <div class="marker-row">
            <div>
              <span class="label">끝 지점</span>
              <strong id="endTime">--:--.---</strong>
            </div>
            <button id="setEndButton" type="button">현재 위치로 설정</button>
          </div>
        </section>

        <section class="segment-panel">
          <div class="segment-panel-header">
            <div>
              <span class="label">구간 목록</span>
              <strong id="segmentCount">0개</strong>
            </div>
            <div class="segment-actions">
              <button id="addSegmentButton" type="button">구간 추가</button>
              <button id="clearSegmentsButton" type="button">전체 삭제</button>
            </div>
          </div>
          <div id="segmentList" class="segment-list empty">
            <p>시작/끝 지점을 설정한 뒤 구간을 추가하세요.</p>
          </div>
        </section>
      </section>

      <aside class="download-panel">
        <header>
          <h1>구간 다운로드</h1>
          <p>iframe 미리보기로 시간을 고르고, yt-dlp와 ffmpeg로 저장합니다.</p>
        </header>

        <section class="status-panel">
          <div id="ytDlpStatus" class="dependency missing">yt-dlp 확인 중</div>
          <div id="ffmpegStatus" class="dependency missing">ffmpeg 확인 중</div>
        </section>

        <nav class="download-view-tabs" aria-label="다운로드 패널 보기">
          <button
            id="setupViewButton"
            class="download-view-tab active"
            type="button"
          >
            설정
          </button>
          <button id="queueViewButton" class="download-view-tab" type="button">
            큐 <span id="queueBadge" class="queue-badge">0</span>
          </button>
        </nav>

        <div id="setupView" class="download-view active">
          <label class="field">
            <span>파일 이름</span>
            <input id="basenameInput" type="text" placeholder="clip" autocomplete="off" />
          </label>

          <label class="field">
            <span>저장 폴더</span>
            <div class="folder-row">
              <input id="outputDirInput" type="text" readonly />
              <button id="selectFolderButton" type="button">선택</button>
            </div>
          </label>

          <section class="option-panel">
            <div class="option-grid">
              <label class="field">
                <span>다운로드 화질</span>
                <select id="downloadQualitySelect">
                  <option value="best">최고 화질</option>
                  <option value="2160">2160p 이하</option>
                  <option value="1440">1440p 이하</option>
                  <option value="1080">1080p 이하</option>
                  <option value="720">720p 이하</option>
                  <option value="480">480p 이하</option>
                  <option value="360">360p 이하</option>
                </select>
              </label>

              <label class="field">
                <span>다운 속도 제한</span>
                <select id="speedLimitSelect">
                  <option value="">무제한</option>
                  <option value="1M">1 MB/s</option>
                  <option value="2M">2 MB/s</option>
                  <option value="5M">5 MB/s</option>
                  <option value="10M">10 MB/s</option>
                  <option value="20M">20 MB/s</option>
                  <option value="50M">50 MB/s</option>
                </select>
              </label>
            </div>

            <label class="field">
              <span>출력 프리셋</span>
              <select id="encodingPresetSelect"></select>
            </label>

            <div id="presetDetails" class="preset-details" aria-live="polite"></div>

            <section class="format-list">
              <span class="label">지원 출력 포맷</span>
              <div id="presetFormatList" class="format-list-body"></div>
            </section>
          </section>

          <div id="setupStatusLabel" class="setup-status" aria-live="polite">
            대기 중
          </div>

          <button id="downloadButton" class="download-button" type="button">
            선택 구간 큐에 추가
          </button>
        </div>

        <div id="queueView" class="download-view hidden">
          <section class="queue-summary">
            <span class="label">다운로드 큐</span>
            <strong id="queueSummary">대기 중 0개</strong>
          </section>

          <div id="queueList" class="queue-list empty">
            <p>다운로드 작업이 없습니다.</p>
          </div>

          <section class="progress-panel">
            <div class="progress-track">
              <div id="progressFill" class="progress-fill"></div>
            </div>
            <div id="progressLabel" class="progress-label">대기 중</div>
            <pre id="logOutput" class="log-output"></pre>
          </section>

          <button id="openOutputButton" class="secondary-button hidden" type="button">
            저장 위치 열기
          </button>
        </div>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
