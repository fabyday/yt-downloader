name: Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag, or full commit SHA (empty = selected workflow branch)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: ci
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate package version against all tags and releases
        id: version
        run: node ci/scripts/release.cjs validate
        env:
          SOURCE_DIRECTORY: source
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}

  package:
    needs: validate
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: win32, arch: x64 }
          - { runner: windows-11-arm, platform: win32, arch: arm64 }
          - { runner: macos-15-intel, platform: darwin, arch: x64 }
          - { runner: macos-15, platform: darwin, arch: arm64 }
    env:
      # Installers remain unsigned; the release stays a draft until manually published.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      # pnpm must exist before setup-node tries to locate/cache its store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test build configuration
        run: pnpm test:build

      - name: Build native application and installers
        run: pnpm build --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Generate artifact manifest
        run: pnpm release:manifest --dir dist/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: kawai-downloader-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/${{ matrix.platform }}-${{ matrix.arch }}/*.exe
            dist/${{ matrix.platform }}-${{ matrix.arch }}/*.dmg
            dist/${{ matrix.platform }}-${{ matrix.arch }}/*.zip
            dist/${{ matrix.platform }}-${{ matrix.arch }}/release-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: kawai-downloader-*
          path: release-assets
          merge-multiple: false
      - name: Create version tag and draft release with installers
        run: node scripts/release.cjs publish
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
